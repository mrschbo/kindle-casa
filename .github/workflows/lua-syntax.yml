name: Lua syntax

on:
  push:
    branches:
      - layout-config
  pull_request:
    branches:
      - calendar-integration

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: |
          find kindlecasa.koplugin -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
